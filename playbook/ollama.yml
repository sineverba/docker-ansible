---
- hosts: workstations
  remote_user: "{{ username }}"
  become: true

  tasks:
    # --- Install ---
    - name: Install dependencies
      ansible.builtin.apt:
        name:
          - curl
          - zstd
        state: present
        cache_valid_time: 3600
      tags: [install]

    - name: Download Ollama install script
      ansible.builtin.get_url:
        url: https://ollama.com/install.sh
        dest: /tmp/ollama-install.sh
        mode: "0755"
      tags: [install]

    - name: Run Ollama install script
      ansible.builtin.command: /tmp/ollama-install.sh
      args:
        creates: /usr/local/bin/ollama
      tags: [install]

    - name: Enable and start Ollama service
      ansible.builtin.systemd:
        name: ollama
        enabled: true
        state: started
      tags: [install]

    - name: Wait for Ollama API
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 11434
        delay: 2
        timeout: 30
      tags: [install]

    # --- Uninstall ---
    - name: Stop and disable Ollama service
      ansible.builtin.systemd:
        name: ollama
        state: stopped
        enabled: false
      ignore_errors: true
      tags: [uninstall]

    - name: Remove Ollama binary
      ansible.builtin.file:
        path: /usr/local/bin/ollama
        state: absent
      tags: [uninstall]

    - name: Remove Ollama data directory
      ansible.builtin.file:
        path: /usr/share/ollama
        state: absent
      tags: [uninstall]

    - name: Remove Ollama systemd service
      ansible.builtin.file:
        path: /etc/systemd/system/ollama.service
        state: absent
      tags: [uninstall]

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      tags: [uninstall]

    - name: Remove Ollama user
      ansible.builtin.user:
        name: ollama
        state: absent
        remove: true
      tags: [uninstall]

    - name: Remove Ollama group
      ansible.builtin.group:
        name: ollama
        state: absent
      tags: [uninstall]